name: graphbench
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10

  # ---- CORE (karateclub-compatible legacy stack) ----
  - numpy=1.22.4
  - pandas=1.3.5
  - networkx=2.6.3
  - scipy=1.10.1
  - scikit-learn=1.1.3
  - matplotlib=3.7.3

  # ---- VISUALIZATION ----
  - seaborn=0.12.*

  # ---- OTHER ----
  - umap-learn=0.5.3
  - tqdm=4.66.*
  - psutil=5.9.*
  - pynvml=11.5.*
  - joblib=1.3.*
  - loguru=0.7.*
  - pyyaml=6.0.*

  # ---- PyTorch CPU from conda ----
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio

  - pip
  - pip:
      - karateclub==1.3.3
      - ogb==1.3.6
